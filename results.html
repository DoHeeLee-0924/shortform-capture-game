<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>누적 실험 결과</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:24px}
    .wrap{max-width:1180px;margin:0 auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(15,23,42,.06);margin-bottom:16px}
    h1{margin:0 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;min-width:260px}button{border:0;border-radius:10px;padding:12px 14px;font-weight:800;color:#fff;background:#2563eb;cursor:pointer}button.secondary{background:#64748b}button.danger{background:#ef4444}.small{font-size:12px;color:#64748b;line-height:1.5}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{border:1px solid #e2e8f0;padding:8px;text-align:left;white-space:nowrap}th{background:#f1f5f9;position:sticky;top:0}#tableWrap{overflow:auto;max-height:68vh;border:1px solid #e2e8f0;border-radius:12px}.stat{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-weight:800;margin-right:8px}.hidden{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>누적 실험 결과</h1>
    <p class="small">참가자에게는 <code>index.html</code> 링크를 공유하고, 연구자는 이 <code>results.html</code> 링크에서 전체 누적 데이터를 확인합니다.</p>
    <div class="row">
      <input id="endpoint" placeholder="Google Apps Script Web App URL" />
      <input id="token" placeholder="관리자 토큰" type="password" />
      <button id="loadBtn">온라인 결과 불러오기</button>
      <button id="localBtn" class="secondary">이 브라우저 로컬 결과 보기</button>
      <button id="csvBtn" class="secondary">CSV 다운로드</button>
      <button id="jsonBtn" class="secondary">JSON 다운로드</button>
    </div>
    <p id="status" class="small"></p>
    <div><span id="count" class="stat">0명</span><span id="updated" class="stat hidden"></span></div>
  </div>
  <div id="tableWrap"><table id="resultTable"><thead></thead><tbody></tbody></table></div>
</div>
<script src="config.js"></script>
<script>
const RESULTS_STORAGE_KEY='shortform_capture_game_participant_results_v2';
let rows=[];
const $=id=>document.getElementById(id);
$('endpoint').value=(window.EXPERIMENT_CONFIG&&window.EXPERIMENT_CONFIG.DATA_ENDPOINT)||'';
function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`}
function toCSV(data){if(!data.length)return 'no_data\n'; const headers=Object.keys(data[0]); return [headers.join(','),...data.map(r=>headers.map(h=>csvEscape(r[h])).join(','))].join('\n')}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function render(data){rows=data||[];$('count').textContent=`${rows.length}명`;const table=$('resultTable');const thead=table.querySelector('thead');const tbody=table.querySelector('tbody');thead.innerHTML='';tbody.innerHTML='';if(!rows.length){$('status').textContent='표시할 데이터가 없습니다.';return}const headers=Object.keys(rows[0]);thead.innerHTML='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';tbody.innerHTML=rows.map(r=>'<tr>'+headers.map(h=>`<td>${String(r[h]??'')}</td>`).join('')+'</tr>').join('');$('status').textContent='결과를 불러왔습니다.'}
function getLocal(){try{return JSON.parse(localStorage.getItem(RESULTS_STORAGE_KEY)||'[]')}catch(e){return []}}
$('localBtn').onclick=()=>render(getLocal());
$('csvBtn').onclick=()=>download('participant_results_accumulated.csv',toCSV(rows),'text/csv;charset=utf-8');
$('jsonBtn').onclick=()=>download('participant_results_accumulated.json',JSON.stringify(rows,null,2),'application/json');
$('loadBtn').onclick=()=>{
  const endpoint=$('endpoint').value.trim(); const token=$('token').value.trim();
  if(!endpoint||!token){$('status').textContent='Web App URL과 관리자 토큰을 입력하세요.';return}
  const cb='jsonp_'+Date.now();
  window[cb]=(payload)=>{try{delete window[cb]}catch(e){}; script.remove(); if(payload&&payload.ok){render(payload.rows||[]);$('updated').classList.remove('hidden');$('updated').textContent=`온라인 데이터`; }else{$('status').textContent='불러오기 실패: '+(payload&&payload.error?payload.error:'알 수 없는 오류')}};
  const script=document.createElement('script');
  script.onerror=()=>{$('status').textContent='불러오기 실패: URL 또는 배포 설정을 확인하세요.'};
  script.src=endpoint+(endpoint.includes('?')?'&':'?')+'action=list&token='+encodeURIComponent(token)+'&callback='+cb;
  document.body.appendChild(script);
  $('status').textContent='불러오는 중...';
};
</script>
</body>
</html>
